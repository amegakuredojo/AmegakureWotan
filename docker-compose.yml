# docker-compose.yml — Despliegue de Producción Hardened de Karasugakure
# REQUIERE: Archivo .env con la variable NEO4J_PASSWORD definida

name: karasugakure

# ─── REDES AISLADAS ─────────────────────────────────────────────────────────
networks:
  # Red interna: Solo intercomunicación entre servicios, sin salida directa a internet
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

  # Red de egreso: Solo el tor-proxy tiene acceso a esta red para enrutar el tráfico externo
  egress:
    driver: bridge
    internal: false

# ─── VOLÚMENES NOMBRADOS (Persistencia Forense Coherente) ────────────────────
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  evidence_vault:
    driver: local
  karasu_sessions:
    driver: local

# ─── SERVICIOS ──────────────────────────────────────────────────────────────
services:

  # ── NEO4J: Graph Database (Hardened) ───────────────────────────────────────
  neo4j:
    image: neo4j:5.18.0-community
    container_name: karasu-neo4j
    restart: unless-stopped
    user: "7474:7474"
    networks:
      internal:
        ipv4_address: 172.28.0.10
    expose:
      - "7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_dbms_connector_http_enabled: "false"
      NEO4J_dbms_connector_bolt_listen__address: "0.0.0.0:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Hardening: Drop all capabilities. No privilege escalation allowed.
    cap_drop:
      - ALL

  # ── TOR PROXY: Egress OPSEC Layer ─────────────────────────────────────────
  tor-proxy:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: karasu-tor
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.28.0.20
      egress: {} # Único con salida a Internet
    expose:
      - "9150"   # Puerto SOCKS5 expuesto únicamente en la red interna
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    healthcheck:
      # Hardening: Verificación interna del puerto sin realizar llamadas HTTP externas
      # Evita la correlación temporal y análisis de firmas de tráfico de red
      test: ["CMD", "nc", "-z", "127.0.0.1", "9150"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── KARASU CORE: Framework Engine ──────────────────────────────────────────
  karasu:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        IMAGE_BUILD_HASH: "${KARASU_IMAGE_HASH:-dev}"
        BUILD_DATE: "${BUILD_DATE:-unknown}"
    image: karasugakure/karasu:latest
    container_name: karasu-core
    restart: "no"
    networks:
      internal:
        ipv4_address: 172.28.0.30
    dns:
      - 0.0.0.0
    depends_on:
      neo4j:
        condition: service_healthy
      tor-proxy:
        condition: service_started
    environment:
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_URI: "bolt://172.28.0.10:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_DATABASE: "neo4j"
      OPSEC_TOR_PROXY: "socks5h://172.28.0.20:9150"
      TOR_PORT: "9150"
      KARASU_DATA_DIR: "/data"
      PYTHONPATH: "/app/src"
      KARASU_RUN_SMOKE_TEST: "${KARASU_RUN_SMOKE_TEST:-false}"
      KARASU_ISOLATION_TIMEOUT: "${KARASU_ISOLATION_TIMEOUT:-120}"
      KARASU_KEY_ROTATION_DAYS: "${KARASU_KEY_ROTATION_DAYS:-30}"
    volumes:
      - evidence_vault:/data
      - karasu_sessions:/data/sessions
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    command: ["--help"]
