# docker-compose.yml — Despliegue de Producción Hardened de Karasugakure
# FORGE_CONTEXT: CIVIL
# FORGE_VERSION: 3.0
# FORGE_DATE: 2026-07-05T15:43:00Z

name: karasugakure

# ─── REDES AISLADAS ─────────────────────────────────────────────────────────
networks:
  # Red interna: Solo intercomunicación entre servicios.
  # internal: true → BLOQUEA salida a Internet desde esta red.
  # Sólo tor-proxy (en red 'egress') tiene acceso externo. KILL SWITCH ACTIVO.
  internal:
    driver: bridge
    internal: true   # FIX-01: WAS false — OPSEC kill switch ahora activo
    ipam:
      config:
        - subnet: 172.28.0.0/24

  # Red de egreso: Solo el tor-proxy tiene acceso a esta red para enrutar el tráfico externo
  egress:
    driver: bridge
    internal: false

# ─── VOLÚMENES NOMBRADOS (Persistencia Forense Coherente) ────────────────────
volumes:
  evidence_vault:
    driver: local
  karasu_sessions:
    driver: local

# ─── SERVICIOS ──────────────────────────────────────────────────────────────
services:

  # ── TOR PROXY: Egress OPSEC Layer ─────────────────────────────────────────
  tor-proxy:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: karasu-tor
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.28.0.20
      egress: {} # Único con salida a Internet
    ports:
      - "9050:9150"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    healthcheck:
      # Hardening: Verificación interna del puerto sin realizar llamadas HTTP externas
      # Evita la correlación temporal y análisis de firmas de tráfico de red
      test: ["CMD", "nc", "-z", "127.0.0.1", "9150"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── SEARXNG: Local OSINT Search Gateway ────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: karasu-searxng
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.28.0.50
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  # ── KARASU CORE: Framework Engine (uso interactivo / CLI) ──────────────────
  karasu:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        IMAGE_BUILD_HASH: "${KARASU_IMAGE_HASH:-dev}"
        BUILD_DATE: "${BUILD_DATE:-unknown}"
    image: karasugakure/karasu:latest
    container_name: karasu-core
    restart: "no"
    networks:
      internal:
        ipv4_address: 172.28.0.30
    dns:
      - 0.0.0.0
    depends_on:
      tor-proxy:
        condition: service_started
      searxng:
        condition: service_started
    environment:
      OPSEC_TOR_PROXY: "socks5h://172.28.0.20:9150"
      TOR_HOST: "172.28.0.20"
      TOR_PORT: "9150"
      KARASU_DATA_DIR: "/data"
      PYTHONPATH: "/app/src"
      KARASU_RUN_SMOKE_TEST: "${KARASU_RUN_SMOKE_TEST:-false}"
      KARASU_ISOLATION_TIMEOUT: "${KARASU_ISOLATION_TIMEOUT:-120}"
      KARASU_KEY_ROTATION_DAYS: "${KARASU_KEY_ROTATION_DAYS:-30}"
      SEARXNG_URL: "http://172.28.0.50:8080/search"
      KARASU_OPSEC_BYPASS_TOR: "${KARASU_OPSEC_BYPASS_TOR:-false}"
    volumes:
      - evidence_vault:/data
      - karasu_sessions:/data/sessions
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    command: ["--help"]

  # ── KARASU MCP: Servidor MCP stdio para AGY / OpenCode ────────────────────
  # Uso: docker compose run --rm -i --no-TTY karasu-mcp run
  # Este servicio está optimizado para MCP: bootstrap silencioso, timeout Tor
  # reducido a 10s, y no fuerza dependencias (se asume stack ya levantado).
  karasu-mcp:
    image: karasugakure/karasu:latest
    container_name: karasu-mcp
    restart: "no"
    profiles:
      - mcp
    networks:
      internal:
        ipv4_address: 172.28.0.31
    dns:
      - 0.0.0.0
    environment:
      OPSEC_TOR_PROXY: "socks5h://172.28.0.20:9150"
      TOR_HOST: "172.28.0.20"
      TOR_PORT: "9150"
      KARASU_DATA_DIR: "/data"
      PYTHONPATH: "/app/src"
      KARASU_SILENT_BOOTSTRAP: "true"        # Suprime banners → no contamina JSON-RPC
      KARASU_MCP_TOR_TIMEOUT: "10"           # Máx 10s esperando Tor en modo MCP
      KARASU_ISOLATION_TIMEOUT: "${KARASU_ISOLATION_TIMEOUT:-120}"
      KARASU_KEY_ROTATION_DAYS: "${KARASU_KEY_ROTATION_DAYS:-30}"
      SEARXNG_URL: "http://172.28.0.50:8080/search"
      KARASU_OPSEC_BYPASS_TOR: "${KARASU_OPSEC_BYPASS_TOR:-false}"
    volumes:
      - evidence_vault:/data
      - karasu_sessions:/data/sessions
    stdin_open: true
    tty: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
