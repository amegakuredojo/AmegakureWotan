[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karasugakure"
version = "0.1.0"
description = "CLI-only OSINT orchestration harness"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "langgraph>=0.2",
]

[project.scripts]
karasu = "karasugakure.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
