[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karasugakure"
version = "0.1.0"
description = "CLI-only OSINT orchestration harness"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.2",
  "neo4j>=5.18.0",
  "httpx[socks]>=0.27",
  "requests[socks]>=2.32",
  "PySocks>=1.7.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "selenium>=4.21",
  "python-gnupg>=0.5.2",
  "anyio>=4.4",
  "tldextract>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "freezegun>=1.5",
]

[project.scripts]
karasu = "karasugakure.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
