# PROTOCOLO: AMEGAKURE_FORGE | CI
# FORGE_CONTEXT: CIVIL
# FORGE_VERSION: AmegakureWotan-1.0
# WOTAN-F6.5: Pipeline CI/CD — verificación automática de la capa Wotan.
#
# El entorno operacional del Dojo valida en cada push/PR:
#   • instalación del paquete amegakurewotan (editable)
#   • suite de no-regresión (pytest) bajo opsec bypass (sin red Tor real)
#   • gate de fallo si algún test se rompe (integridad de la cadena de custodia)
name: CI — AmegakureWotan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: "Suite Wotan (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      AMEWOTAN_OPSEC_BYPASS_TOR: "true"
      AMEWOTAN_DATA_DIR: "/tmp/amewotan-ci-data"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Tor client stub optional)
        run: |
          sudo apt-get update || true
          # No se requiere Tor real en CI; los adapters usan bypass opsec.

      - name: Install project (editable) + test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-timeout pytest-cov

      - name: Run test suite + coverage gate (≥55%)
        # Umbral honesto (WOTAN-TRL plan Fase B): los comandos de agentes en vivo
        # (recon/humint/darkweb/entity) y graph.* requieren Kùzu/Tor reales y se
        # eximen explícitamente; 55% cubre toda la lógica gobernada (GELSI/RoE/DFIR/
        # CLI/rate-limit/misión/cadena/ledger) que SÍ es determinista y hermética.
        run: |
          python -m pytest tests/ -q --no-header -p no:cacheprovider \
            --timeout=60 --cov=amegakurewotan --cov-report=term-missing \
            --cov-fail-under=55

  smoke-cli:
    name: "Smoke CLI amewotan (end-to-end real)"
    runs-on: ubuntu-latest
    needs: test
    env:
      AMEWOTAN_OPSEC_BYPASS_TOR: "true"
      AMEWOTAN_DATA_DIR: "/tmp/amewotan-ci-smoke"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-timeout
      - name: CLI — dispatch + forensic sign/verify + hitl list
        run: |
          python -m amegakurewotan.cli_wotan mcp dispatch defense.phishing_detect --args '{"subject":"examp1e.com","params":{}}'
          python -m amegakurewotan.cli_wotan forensic sign
          python -m amegakurewotan.cli_wotan forensic verify-sign
          python -m amegakurewotan.cli_wotan hitl list
      - name: CLI — misión end-to-end gobernada (WOTAN-F7)
        run: |
          # Misión real: recon pasivo ALLOW, activa DENY sin RoE, cadena sellada y
          # firmada Ed25519. Verifica que la firma de la cadena resultante es válida.
          python -m amegakurewotan.cli_wotan mission plans
          python -m amegakurewotan.cli_wotan mission run ci-target.example --plan osint_recon --operator ci
          python -m amegakurewotan.cli_wotan mission list
          python -m amegakurewotan.cli_wotan forensic verify
          python -m amegakurewotan.cli_wotan forensic verify-sign

  package:
    name: "Empaquetado + despliegue limpio (wheel install real)"
    runs-on: ubuntu-latest
    needs: test
    env:
      AMEWOTAN_OPSEC_BYPASS_TOR: "true"
      AMEWOTAN_DATA_DIR: "/tmp/amewotan-ci-pkg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Instalar el wheel en un entorno limpio y validar el console_script
        run: |
          python -m venv /tmp/clean-venv
          . /tmp/clean-venv/bin/activate
          pip install --upgrade pip
          pip install dist/amegakurewotan-*.whl
          # El binario 'amewotan' debe existir en PATH y ejecutar la misión E2E real.
          which amewotan
          amewotan doctrine
          amewotan mission run pkg-target.example --plan osint_recon --operator ci-pkg
          amewotan forensic verify
          amewotan forensic verify-sign
